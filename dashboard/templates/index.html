<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogRecon — System Initialization</title>
    <!-- Google Fonts: Sora + Share Tech Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <script>
        // Check localStorage before rendering body — skip intro for returning visitors
        if (localStorage.getItem('has_visited_intro')) {
            window.location.href = '/scan';
        }
    </script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #050505;
            color: #e8e8e8;
            font-family: 'Sora', system-ui, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Red vignette around screen edges */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            box-shadow: inset 0 0 180px rgba(255, 34, 51, 0.35);
            z-index: 10;
        }

        /* Subtle scanline overlay animation */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 200vh;
            pointer-events: none;
            background: linear-gradient(
                to bottom,
                rgba(14, 14, 14, 0),
                rgba(14, 14, 14, 0) 50%,
                rgba(0, 0, 0, 0.3) 50%,
                rgba(0, 0, 0, 0.3)
            );
            background-size: 100% 4px;
            opacity: 0.12;
            animation: scrollScanlines 12s linear infinite;
            z-index: 9;
        }

        @keyframes scrollScanlines {
            0% { transform: translateY(0); }
            100% { transform: translateY(-50%); }
        }

        /* Stage Centering Container */
        .intro-stage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 100vw;
            padding: 0 4rem;
            z-index: 20;
        }

        /* Step 4: Title LOGRECON */
        .title-text {
            color: #e8e8e8;
            font-size: 48px;
            font-family: 'Sora', system-ui, sans-serif;
            font-weight: 600;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            min-height: 56px;
            text-shadow: 0 0 40px rgba(255, 34, 51, 0.8);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        /* Step 2 & 3: Red dot & expand into thin red line */
        .red-dot {
            width: 8px;
            height: 8px;
            background-color: #cc2233;
            border-radius: 50%;
            box-shadow: 0 0 14px rgba(204, 34, 51, 0.6);
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.3s ease;
            margin: 6px 0;
        }

        .red-dot.pulse {
            opacity: 1;
            transform: scale(1.6);
            box-shadow: 0 0 18px rgba(204, 34, 51, 0.5);
        }

        .red-line {
            height: 2px;
            background-color: #ff2233;
            box-shadow: 0 0 12px rgba(255, 34, 51, 0.6);
            width: 0%;
            margin: 14px 0;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .red-line.expanded {
            width: 100%;
        }

        /* Step 5 & 7: Subtitle text */
        .subtitle-text {
            color: #6b6b6b;
            font-size: 16px;
            font-family: 'Sora', system-ui, sans-serif;
            font-weight: 400;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            min-height: 22px;
            opacity: 0;
            transition: opacity 0.2s ease;
            transition: font-size 0.2s ease, color 0.2s ease, text-shadow 0.2s ease;
        }

        /* Step 6: Fake loading bar */
        .loading-bar-container {
            width: 400px;
            max-width: 90vw;
            height: 4px;
            background-color: #1a1a1a;
            border-radius: 2px;
            margin-top: 14px;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .loading-bar-fill {
            height: 100%;
            width: 0%;
            background-color: #cc2233;
            box-shadow: 0 0 8px rgba(204, 34, 51, 0.4);
            transition: width 1s linear;
        }

        /* Step 8: Screen fade to black overlay */
        .fade-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #050505;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease-in-out;
            z-index: 100;
        }

        .fade-overlay.active {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="vignette"></div>
    <div class="scanlines"></div>

    <div class="intro-stage">
        <div id="titleText" class="title-text"></div>
        <div id="redLine" class="red-line"></div>
        <div id="redDot" class="red-dot"></div>
        <div id="subtitleText" class="subtitle-text"></div>
        
        <div id="loadingContainer" class="loading-bar-container">
            <div id="loadingFill" class="loading-bar-fill"></div>
        </div>
    </div>

    <div id="fadeOverlay" class="fade-overlay"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Guard: if already visited, redirect immediately
            if (localStorage.getItem('has_visited_intro')) {
                window.location.href = '/scan';
                return;
            }

            const redDot = document.getElementById('redDot');
            const redLine = document.getElementById('redLine');
            const titleText = document.getElementById('titleText');
            const subtitleText = document.getElementById('subtitleText');
            const loadingContainer = document.getElementById('loadingContainer');
            const loadingFill = document.getElementById('loadingFill');
            const fadeOverlay = document.getElementById('fadeOverlay');

            // Typewriter helper
            function typeText(element, text, durationMs, callback) {
                element.style.opacity = '1';
                element.textContent = '';
                const charDelay = durationMs / text.length;
                let i = 0;
                const timer = setInterval(() => {
                    if (i < text.length) {
                        element.textContent += text.charAt(i);
                        i++;
                    } else {
                        clearInterval(timer);
                        if (callback) callback();
                    }
                }, charDelay);
            }

            // --- INTRO SEQUENCE TIMELINE ---

            // Step 1: (0.0s - 0.5s) Full black screen

            // Step 2: (0.5s) Red dot appears in center & pulses once
            setTimeout(() => {
                redDot.classList.add('pulse');
            }, 500);

            // Step 3: (1.0s) Dot expands into thin red horizontal line
            setTimeout(() => {
                redDot.style.display = 'none';
                redLine.classList.add('expanded');
            }, 1000);

            // Step 4: (1.5s) Text above line "LOGRECON" types letter by letter
            setTimeout(() => {
                typeText(titleText, "LOGRECON", 400);
            }, 1500);

            // Step 5: (2.0s) Subtitle "INITIALIZING THREAT INTELLIGENCE SYSTEM..." types out
            setTimeout(() => {
                typeText(subtitleText, "INITIALIZING THREAT INTELLIGENCE SYSTEM...", 450);
            }, 2000);

            // Step 6: (2.5s - 3.5s) Loading bar appears and animates 0% -> 100% width over 1s
            setTimeout(() => {
                loadingContainer.style.opacity = '1';
                setTimeout(() => {
                    loadingFill.style.width = '100%';
                }, 50);
            }, 2500);

            // Step 7: (3.5s) Loading bar completes, text changes to "ACCESS GRANTED" for 0.3s
            setTimeout(() => {
                subtitleText.style.color = '#ff2233';
                subtitleText.style.fontSize = '32px';
                subtitleText.style.fontWeight = '700';
                subtitleText.style.textShadow = '0 0 30px rgba(255, 34, 51, 0.7)';
                subtitleText.textContent = "ACCESS GRANTED";
            }, 3500);

            // Step 8: (4.0s) Entire screen fades to black
            setTimeout(() => {
                fadeOverlay.classList.add('active');
            }, 4000);

            // Step 9: (4.2s) Save localStorage flag and automatically redirect to /scan
            setTimeout(() => {
                localStorage.setItem('has_visited_intro', 'true');
                window.location.href = '/scan';
            }, 4200);
        });
    </script>
</body>
</html>
