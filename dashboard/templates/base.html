<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>LogRecon</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #050508;
            color: #e0e0e0;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            position: relative;
            overflow-x: hidden;
        }

        /* DIGITAL EARTH VIDEO BACKGROUND LAYER */
        #video-bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            background: #000000;
        }

        .bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: 51% 8%;
            opacity: 0;
            transition: opacity 0.9s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            will-change: opacity;
        }

        .bg-video.active {
            opacity: 1;
        }

        @media (prefers-reduced-motion: reduce) {
            .bg-video {
                transition: none !important;
            }
        }

        /* SIDEBAR */
        .sidebar {
            width: 240px;
            background: rgba(8, 8, 12, 0.95);
            border-right: 1px solid #1a1a1a;
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            position: fixed;
            height: 100vh;
            left: -240px;
            top: 0;
            transition: left 0.3s ease;
            z-index: 100;
            backdrop-filter: blur(12px);
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar-brand {
            padding: 0 20px 24px 20px;
            border-bottom: 1px solid #1a1a1a;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-brand span {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: -0.02em;
        }

        .sidebar-nav {
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-grow: 1;
        }

        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 8px;
            color: #666666;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.15s ease;
        }

        .sidebar-nav a:hover {
            background: #111111;
            color: #e0e0e0;
        }

        .sidebar-nav a.active {
            background: #111111;
            color: #e0e0e0;
        }

        .sidebar-nav .nav-icon {
            width: 18px;
            height: 18px;
            opacity: 0.7;
        }

        .sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid #1a1a1a;
            font-size: 12px;
            color: #333333;
        }

        /* OVERLAY */
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 99;
        }

        .sidebar-overlay.show {
            display: block;
        }

        /* TOP BAR */
        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: rgba(5, 5, 8, 0.9);
            border-bottom: 1px solid rgba(168, 139, 250, 0.12);
            display: flex;
            align-items: center;
            padding: 0 24px;
            gap: 16px;
            z-index: 50;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .menu-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(20, 16, 32, 0.8);
            border: 1px solid rgba(168, 139, 250, 0.2);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            flex-shrink: 0;
        }

        .menu-btn:hover {
            background: rgba(34, 28, 54, 0.9);
            border-color: rgba(192, 168, 255, 0.4);
        }

        .menu-btn svg {
            width: 16px;
            height: 16px;
            stroke: #d0c8ec;
        }

        .topbar-title {
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            font-family: 'JetBrains Mono', monospace;
        }

        .topbar-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(16, 13, 26, 0.85);
            border: 1px solid rgba(168, 139, 250, 0.2);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 11px;
            color: #c4bedc;
            font-family: 'JetBrains Mono', monospace;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.6);
            animation: pulse-glow 2s infinite;
        }

        @keyframes pulse-glow {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        /* MAIN CONTENT */
        .main {
            position: relative;
            z-index: 1;
            margin-top: 56px;
            padding: 20px 24px;
            width: 100%;
            min-height: calc(100vh - 56px);
            box-sizing: border-box;
        }

        /* CARDS */
        .card {
            background: rgba(10, 10, 14, 0.85);
            border: 1px solid #1a1a1a;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 16px;
            backdrop-filter: blur(8px);
        }

        .card-title {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.08em;
            color: #444444;
            text-transform: uppercase;
            margin-bottom: 16px;
            font-family: 'JetBrains Mono', monospace;
        }

        /* BUTTONS */
        .btn-primary {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            font-family: 'Inter', sans-serif;
            box-shadow: none;
        }

        .btn-primary:hover {
            background: #e0e0e0;
            box-shadow: none;
        }

        .btn-secondary {
            background: transparent;
            color: #888888;
            border: 1px solid #2a2a2a;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            font-family: 'Inter', sans-serif;
        }

        .btn-secondary:hover {
            background: #1a1a1a;
            color: #ffffff;
            border-color: #444444;
        }

        /* INPUT */
        .input-field {
            background: #080808;
            border: 1px solid #1a1a1a;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 14px;
            color: #e0e0e0;
            font-family: 'JetBrains Mono', monospace;
            width: 100%;
            outline: none;
            transition: border 0.15s;
        }

        .input-field:focus {
            border-color: #444444;
            box-shadow: none;
        }

        .input-field::placeholder {
            color: #444444;
        }

        /* TABLE */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .data-table th {
            text-align: left;
            padding: 8px 12px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.06em;
            color: #333333;
            text-transform: uppercase;
            border-bottom: 1px solid #1a1a1a;
            font-family: 'JetBrains Mono', monospace;
        }

        .data-table td {
            padding: 12px 12px;
            border-bottom: 1px solid #141414;
            color: #888888;
        }

        .data-table tr:hover td {
            background: rgba(255, 255, 255, 0.03);
        }

        /* BADGES */
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
        }

        .badge-critical {
            background: #2d0a0a;
            color: #f87171;
            border: 1px solid #3d1010;
        }

        .badge-high {
            background: #2d1a0a;
            color: #fb923c;
            border: 1px solid #3d2510;
        }

        .badge-medium {
            background: #2d2a0a;
            color: #fbbf24;
            border: 1px solid #3d3510;
        }

        .badge-low {
            background: #0a2d0a;
            color: #4ade80;
            border: 1px solid #103d10;
        }

        .badge-port {
            background: #111111;
            color: #888888;
            border: 1px solid #222222;
        }

        /* AI ANALYSIS */
        .ai-box {
            background: #0f0f0f;
            border-left: 2px solid #222222;
            border-radius: 0 8px 8px 0;
            padding: 20px 24px;
            font-size: 14px;
            line-height: 1.8;
            color: #888888;
            font-family: 'Inter', sans-serif;
        }

        .ai-box h3 {
            font-size: 11px;
            font-weight: 600;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin: 16px 0 6px 0;
            font-family: 'JetBrains Mono', monospace;
        }

        .ai-box h3:first-child {
            margin-top: 0;
        }

        .ai-box p {
            margin-bottom: 12px;
            color: #7788aa;
        }

        .ai-box strong {
            color: #c0d8f0;
            font-weight: 600;
        }

        /* SCANNING */
        .scan-progress {
            background: rgba(6, 13, 30, 0.9);
            border: 1px solid #1a1a1a;
            border-radius: 12px;
            padding: 32px;
            text-align: center;
            display: none;
        }

        .scan-progress.show {
            display: block;
        }

        .scan-spinner {
            width: 32px;
            height: 32px;
            border: 2px solid #1a1a1a;
            border-top-color: #666666;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .scan-label {
            font-size: 13px;
            color: #334466;
            font-family: 'JetBrains Mono', monospace;
        }

        /* GRID */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        @media (max-width: 768px) {

            .grid-2,
            .grid-4 {
                grid-template-columns: 1fr;
            }
        }

        /* STAT CARD */
        .stat-card {
            background: rgba(10, 10, 14, 0.85);
            border: 1px solid #1a1a1a;
            border-radius: 10px;
            padding: 16px 20px;
        }

        .stat-label {
            font-size: 11px;
            color: #333333;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 8px;
            font-family: 'JetBrains Mono', monospace;
        }

        .stat-value {
            font-size: 22px;
            font-weight: 700;
            color: #e0e0e0;
            font-family: 'JetBrains Mono', monospace;
        }

        .stat-sub {
            font-size: 12px;
            color: #334466;
            margin-top: 4px;
        }
    </style>
</head>

<body>

    <!-- Digital Earth Video Background -->

        <video id="bg-video-a" class="bg-video active" muted playsinline preload="auto" poster="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/82e7eb75-c65f-490a-99b5-f3d1cad54200.webp">
            <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260912_104036_bd6924f6-3c8e-417e-8465-6d03c8c2e9e6.mp4" type="video/mp4" />
        </video>
        <video id="bg-video-b" class="bg-video" muted playsinline preload="auto" poster="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/82e7eb75-c65f-490a-99b5-f3d1cad54200.webp">
            <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260912_104036_bd6924f6-3c8e-417e-8465-6d03c8c2e9e6.mp4" type="video/mp4" />
        </video>
    </div>

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="overlay" onclick="closeSidebar()"></div>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
            </svg>

        </div>

                    <rect x="14" y="14" width="7" height="7" />

                </svg>
                Dashboard
            </a>
            <a href="/scan/ip" {% if request.endpoint in ['scanner','scan','scan_ip'] %}class="active" {% endif %}>

            </a>

                Local Scanner
            </a>
            <a href="/logs" {% if request.endpoint in ['logs','log_analyzer'] %}class="active" {% endif %}>

                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                    <polyline points="14 2 14 8 20 8" />
                    <line x1="16" y1="13" x2="8" y2="13" />
                    <line x1="16" y1="17" x2="8" y2="17" />
                </svg>
                Log Analyzer
            </a>
            <a href="/correlate" {% if request.endpoint=='correlate_page' %}class="active" {% endif %}>
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="9" cy="7" r="3"/>
                    <circle cx="15" cy="17" r="3"/>
                    <line x1="9" y1="10" x2="15" y2="14"/>
                    <line x1="3" y1="7" x2="6" y2="7"/>
                    <line x1="18" y1="17" x2="21" y2="17"/>
                </svg>
                Correlated Findings
            </a>
            <a href="/history" {% if request.endpoint=='history' %}class="active" {% endif %}>
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10" />
                    <polyline points="12 6 12 12 16 14" />
                </svg>
                History
            </a>
            <a href="/alerts" {% if request.endpoint=='alerts_page' %}class="active" {% endif %}>
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                </svg>

            </a>
            <a href="/reports" {% if request.endpoint=='reports' %}class="active" {% endif %}>
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />

            <a href="/settings" {% if request.endpoint=='settings' %}class="active" {% endif %}>
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3" />
                    <path
                        d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
                </svg>
                Settings
            </a>
        </nav>
        <div class="sidebar-footer">LogRecon v1.0 · Security Intelligence</div>
    </div>

    <!-- Top Bar -->
    <div class="topbar">
        <button class="menu-btn" onclick="toggleSidebar()">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
                <line x1="3" y1="6" x2="21" y2="6" stroke="currentColor" />
                <line x1="3" y1="12" x2="21" y2="12" stroke="currentColor" />
                <line x1="3" y1="18" x2="21" y2="18" stroke="currentColor" />
            </svg>
        </button>
        <span class="topbar-title">LogRecon</span>
        <div class="topbar-right">
            <div class="status-pill">
                <div class="status-dot"></div>
                Systems Online
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main">
        {% block content %}{% endblock %}
    </div>

    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('show');
        }
        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('overlay').classList.remove('show');
        }
    </script>

    <!-- Seamless Video Crossfade Background Controller -->
    <script>
        (function () {
            const videoA = document.getElementById('bg-video-a');
            const videoB = document.getElementById('bg-video-b');
            if (!videoA || !videoB) return;

            const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
            const CROSSFADE_DURATION = 0.9; // seconds

            let activeVideo = videoA;
            let standbyVideo = videoB;
            let isCrossfading = false;

            function initBackground() {
                if (prefersReducedMotion.matches) {
                    videoA.pause();
                    videoB.pause();
                    videoA.classList.add('active');
                    videoB.classList.remove('active');
                    return;
                }

                const playPromise = videoA.play();
                if (playPromise !== undefined) {
                    playPromise.catch(function () {});
                }
            }

            function handleTimeUpdate(e) {
                if (prefersReducedMotion.matches) return;
                const current = e.target;
                if (current !== activeVideo || isCrossfading) return;

                if (current.duration && current.currentTime >= current.duration - CROSSFADE_DURATION) {
                    isCrossfading = true;
                    standbyVideo.currentTime = 0;

                    const playPromise = standbyVideo.play();
                    if (playPromise !== undefined) {
                        playPromise.catch(function () {});
                    }

                    standbyVideo.classList.add('active');
                    activeVideo.classList.remove('active');

                    setTimeout(function () {
                        activeVideo.pause();
                        activeVideo.currentTime = 0;

                        // Swap active and standby roles
                        const temp = activeVideo;
                        activeVideo = standbyVideo;
                        standbyVideo = temp;
                        isCrossfading = false;
                    }, CROSSFADE_DURATION * 1000);
                }
            }

            videoA.addEventListener('timeupdate', handleTimeUpdate);
            videoB.addEventListener('timeupdate', handleTimeUpdate);

            function handleEnded(e) {
                if (prefersReducedMotion.matches) return;
                if (!isCrossfading && e.target === activeVideo) {
                    isCrossfading = true;
                    standbyVideo.currentTime = 0;
                    standbyVideo.play().catch(function () {});
                    standbyVideo.classList.add('active');
                    activeVideo.classList.remove('active');

                    setTimeout(function () {
                        activeVideo.pause();
                        activeVideo.currentTime = 0;
                        const temp = activeVideo;
                        activeVideo = standbyVideo;
                        standbyVideo = temp;
                        isCrossfading = false;
                    }, CROSSFADE_DURATION * 1000);
                }
            }

            videoA.addEventListener('ended', handleEnded);
            videoB.addEventListener('ended', handleEnded);

            prefersReducedMotion.addEventListener('change', function (e) {
                if (e.matches) {
                    videoA.pause();
                    videoB.pause();
                    videoA.classList.add('active');
                    videoB.classList.remove('active');
                } else {
                    activeVideo.play().catch(function () {});
                }
            });

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initBackground);
            } else {
                initBackground();
            }
        })();
    </script>

    {% block scripts %}{% endblock %}
</body>

</html>
